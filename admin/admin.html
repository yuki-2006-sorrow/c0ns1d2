<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0d1117; color: #e6e6e6; display: flex; height: 100vh; overflow: hidden; }

  .mini-btn:hover { border-color: #4ca1af; color: #4ca1af; }

  .list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }

  .item .m { flex-wrap: wrap; }

  .field textarea { resize: vertical; line-height: 1.6; }

  .imgs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

  .btn-bar { position: sticky; bottom: 0; background: #0d1117; padding: 14px 0; border-top: 1px solid #1e2632; display: flex; align-items: center; gap: 14px; }
  .btn { padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; }
  .btn-save { background: #4ca1af; color: #fff; }
  .btn-save:hover { background: #5dbac9; }
  .btn-build { background: #1f2a3a; color: #e6e6e6; }
  .btn-build:hover { background: #2a3441; }
  .status { font-size: 0.85rem; color: #8a97a8; }
  .status.ok { color: #4ca1af; }
  .empty { color: #a1adbc; text-align: center; padding: 40px 20px; font-size: 0.9rem; }

  .list { min-height: 0; }
  .association-form .btn-bar { position: static; }

  .editor-tabs button[aria-pressed="true"] { border-color: #4ca1af; color: #80cbd4; }
  .association-editor { margin-top: 36px; border-top: 1px solid #35404b; padding-top: 24px; }
  .association-editor h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 12px; }
  .association-item { padding: 14px 0; border-bottom: 1px solid #2a3441; display: flex; align-items: start; justify-content: space-between; gap: 16px; }
  .association-item p { margin-top: 8px; white-space: pre-wrap; color: #b4bec9; line-height: 1.7; }
  .association-form { margin-top: 22px; }
  .association-form .field input[type="checkbox"] { width: auto; }
  .work-heading { font-size: 1.3rem; font-weight: 500; margin-bottom: 22px; }
  .status { white-space: pre-wrap; overflow-wrap: anywhere; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid #80cbd4; outline-offset: 3px; }

</style>
<style>

<body>
  <div class="sidebar">
    <h1>c0ns1d2 编辑后台</h1>
    <div id="connection-notice" class="connection-notice" role="status" hidden><p>本地编辑服务未连接。请双击项目中的「启动.bat」，然后点「重新连接」。当前已输入的文字可以先留在页面中。</p><button type="button" class="mini-btn" id="connection-retry">重新连接</button></div>
